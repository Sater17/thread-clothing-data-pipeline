[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thread-clothing-pipeline"
version = "1.0.0"
description = "Contract-first omnichannel clothing data pipeline"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=12,<27"]
cloud = ["boto3>=1.35,<2"]
dev = ["cfn-lint>=1.57,<2"]

[tool.setuptools.packages.find]
include = ["thread_pipeline*"]
