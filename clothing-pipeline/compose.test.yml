services:
  dynamodb:
    image: amazon/dynamodb-local@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
    command: '-jar DynamoDBLocal.jar -inMemory -sharedDb'
  tests:
    image: thread-pipeline-spark-tests:3.5.4
    depends_on:
      - dynamodb
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    environment:
      PYTHONPATH: /workspace/src:/workspace
      PYTHONDONTWRITEBYTECODE: '1'
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      PYSPARK_SUBMIT_ARGS: '--driver-memory 2g pyspark-shell'
    command: python -m pytest tests/integration/test_coordinator_dynamodb.py -q -p no:cacheprovider -x
