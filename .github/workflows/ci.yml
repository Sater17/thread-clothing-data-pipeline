name: Pipeline CI

on:
  push:
    paths: ['clothing-pipeline/**', '.github/workflows/**']
  pull_request:
    paths: ['clothing-pipeline/**', '.github/workflows/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: clothing-pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python scripts/dev.py test --suite unit

  reference:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clothing-pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python scripts/dev.py test --suite reference

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clothing-pipeline
    steps:
      - uses: actions/checkout@v7
      - name: Build isolated Spark and Iceberg test runtime
        run: docker build -f Dockerfile.test -t thread-pipeline-spark-tests:3.5.4 .
      - name: Test queried coordinator with DynamoDB Local
        run: docker compose -p thread-pipeline-tests -f compose.test.yml run --rm tests
      - name: Test native Spark transformations and Iceberg publication
        run: >-
          docker run --rm --memory 4g
          -v "$PWD:/workspace:ro" -w /workspace
          -e PYTHONPATH=/workspace/src:/workspace
          -e 'PYSPARK_SUBMIT_ARGS=--driver-memory 2g pyspark-shell'
          thread-pipeline-spark-tests:3.5.4
          python -m pytest tests/integration -m spark -q -p no:cacheprovider
      - name: Clean test services
        if: always()
        run: docker compose -p thread-pipeline-tests -f compose.test.yml down

  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clothing-pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/build_deploy.py
      - run: python scripts/lint_infra.py
      - uses: actions/upload-artifact@v7
        with:
          name: pipeline-release
          path: |
            clothing-pipeline/dist/glue_job.py
            clothing-pipeline/dist/thread_runtime.zip
            clothing-pipeline/dist/control.zip
            clothing-pipeline/dist/cloudformation.json
            clothing-pipeline/dist/release.json
          retention-days: 7
