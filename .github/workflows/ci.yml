name: Pipeline CI

on:
  push:
    paths: ['clothing-pipeline/**', '.github/workflows/**']
  pull_request:
    paths: ['clothing-pipeline/**', '.github/workflows/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    defaults:
      run:
        working-directory: clothing-pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Glue-compatible dependencies
        if: matrix.python == '3.9'
        run: python -m pip install -e . numpy==1.26.4 pyarrow==12.0.1
      - name: Install local dependencies
        if: matrix.python == '3.12'
        run: python -m pip install -e '.[parquet]'
      - name: Run unit and integration tests without AWS
        run: python scripts/dev.py test

  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clothing-pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,parquet]'
      - run: python scripts/build_deploy.py
      - run: python scripts/lint_infra.py
      - uses: actions/upload-artifact@v7
        with:
          name: pipeline-release
          path: clothing-pipeline/dist/
          retention-days: 7

  smoke:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clothing-pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[parquet]'
      - run: python scripts/dev.py history --output data/ci/input --days 2 --orders-per-day 20 --skus 12 --daily-snapshots
      - run: python scripts/dev.py run --input data/ci/input --state data/ci/ledger.sqlite --output data/ci/output --check-history --parquet
