name: AWS deployment manual

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Create a reviewable change set, or execute it after checks'
        type: choice
        options: ['plan-only', 'apply']
        default: 'plan-only'
      notification_email:
        description: 'SNS email recipient; leave empty to preserve current subscription'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: aws-thread-deployment
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      ARTIFACT_BUCKET: ${{ vars.AWS_ARTIFACT_BUCKET }}
      STACK_NAME: thread-clothing-pipeline
      DEPLOY_MODE: ${{ inputs.mode }}
      NOTIFICATION_EMAIL: ${{ inputs.notification_email || vars.AWS_ALERT_EMAIL }}
    defaults:
      run:
        working-directory: clothing-pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: pipeline-release
          path: clothing-pipeline/dist
      - name: Check required repository variables
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$ARTIFACT_BUCKET"
          test -n "$ROLE_ARN"
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: thread-deploy-${{ github.run_id }}
      - run: python -m pip install -e '.[cloud]'
      - name: Upload release and create change set
        run: |
          email_args=()
          if [ -n "$NOTIFICATION_EMAIL" ]; then
            email_args=(--notification-email "$NOTIFICATION_EMAIL")
          fi
          python scripts/deploy_release.py --stack "$STACK_NAME" --bucket "$ARTIFACT_BUCKET" --region "$AWS_REGION" --prefix "thread-runtime/$GITHUB_SHA" --mode "$DEPLOY_MODE" "${email_args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: aws-change-set
          path: clothing-pipeline/dist/change-set.json
          retention-days: 7
